# Stage 1: Continued Pre-Training (CLM on raw domain text)
stage: cpt

model:
  base_model_name: null
  max_seq_length: 2048
  load_in_4bit: true
  dtype: null  # auto-detect (bf16 if supported, else fp16)

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: "unsloth"

data:
  block_size: 2048
  corpus_dir: ./data/domain_corpus
  val_split: 0.05

training:
  output_dir: ./outputs/cpt
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  seed: 42
  optim: "adamw_8bit"
  report_to: "wandb"